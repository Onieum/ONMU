$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineDeployment.schema.json
name: __DEPLOYMENT_NAME__
endpoint_name: __ENDPOINT_NAME__
description: ONMU OOTD avatar generation deployment.
code_configuration:
  code: ..
  scoring_script: score.py
environment:
  build:
    path: ..
    dockerfile_path: __DOCKERFILE_PATH__
instance_type: __INSTANCE_TYPE__
instance_count: 1
request_settings:
  request_timeout_ms: 180000
  max_concurrent_requests_per_instance: 1
liveness_probe:
  initial_delay: 900
  period: 60
  timeout: 60
  failure_threshold: 10
readiness_probe:
  initial_delay: 900
  period: 60
  timeout: 60
  failure_threshold: 10
environment_variables:
  ONMU_HF_TOKEN: "__ONMU_HF_TOKEN__"
  ONMU_OOTD_MODEL_ID: "__ONMU_OOTD_MODEL_ID__"
  ONMU_OOTD_MODEL_REVISION: "__ONMU_OOTD_MODEL_REVISION__"
  ONMU_OOTD_DRY_RUN: "__ONMU_OOTD_DRY_RUN__"
  ONMU_OOTD_DEVICE: "cuda"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  ONMU_OOTD_MAX_STEPS: "8"
  ONMU_OOTD_MAX_WIDTH: "512"
  ONMU_OOTD_MAX_HEIGHT: "512"
  ONMU_OOTD_MAX_SEQUENCE_LENGTH: "128"
tags:
  app: onmu
  environment: staging
  domain: ootd
  costPolicy: single-t4-dry-run-first
