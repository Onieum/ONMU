server:
  address: ${SERVER_ADDRESS:${API_HOST:127.0.0.1}}
  port: ${SERVER_PORT:${API_PORT:8080}}

spring:
  application:
    name: onmu-api-spring
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_HOST_PORT:15432}/onmu}
    username: ${SPRING_DATASOURCE_USERNAME:onmu}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:onmu-local-only}}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

onmu:
  auth:
    issuer: ${ONMU_AUTH_ISSUER:onmu-api}
    audience: ${ONMU_AUTH_AUDIENCE:onmu-mobile}
    access-token-secret: ${ONMU_ACCESS_TOKEN_SECRET:local-dev-access-token-secret-change-before-shared-dev}
    access-token-ttl: ${ONMU_ACCESS_TOKEN_TTL:30m}
    refresh-token-ttl: ${ONMU_REFRESH_TOKEN_TTL:30d}
    allowed-origins: ${ONMU_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080,https://dev-api.onmu.cloud,https://int-api.onmu.cloud}
