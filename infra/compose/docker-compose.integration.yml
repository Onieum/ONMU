name: onmu-integration

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: onmu-int-postgres
    environment:
      POSTGRES_DB: ${INT_POSTGRES_DB:-onmu_integration}
      POSTGRES_USER: ${INT_POSTGRES_USER:-onmu_int}
      POSTGRES_PASSWORD: ${INT_POSTGRES_PASSWORD:-onmu-integration-local-only}
    ports:
      - "127.0.0.1:${INT_POSTGRES_HOST_PORT:-16432}:5432"
    volumes:
      - integration-postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: onmu-int-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${INT_REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - integration-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: onmu-int-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${INT_MINIO_ROOT_USER:-onmu-int}
      MINIO_ROOT_PASSWORD: ${INT_MINIO_ROOT_PASSWORD:-onmu-integration-local-only}
    ports:
      - "127.0.0.1:${INT_MINIO_API_HOST_PORT:-9100}:9000"
      - "127.0.0.1:${INT_MINIO_CONSOLE_HOST_PORT:-9101}:9001"
    volumes:
      - integration-minio-data:/data

volumes:
  integration-postgres-data:
  integration-redis-data:
  integration-minio-data:
