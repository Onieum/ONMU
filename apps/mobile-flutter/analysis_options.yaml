# 이 파일은 Dart code를 정적 분석해 error, warning, lint를 확인하는 analyzer를 설정합니다.
#
# analyzer가 찾은 issue는 Dart 지원 IDE의 UI에 표시됩니다.
# command line에서는 `flutter analyze`로 analyzer를 실행할 수 있습니다.

# 아래 줄은 Flutter app, package, plugin에 권장되는 lint rule 묶음을 활성화합니다.
include: package:flutter_lints/flutter.yaml

linter:
  # 이 project에 적용되는 lint rule은 아래 section에서 조정할 수 있습니다.
  # 위에서 포함한 `package:flutter_lints/flutter.yaml`의 rule을 끄거나 추가 rule을 켤 수 있습니다.
  # 사용 가능한 lint 목록과 문서는 https://dart.dev/lints 에 있습니다.
  #
  # 전체 project에서 lint rule을 끄는 대신 특정 줄이나 파일에서만 억제할 수도 있습니다.
  # lint가 발생한 줄에는 `// ignore: name_of_lint`, 파일에는 `// ignore_for_file: name_of_lint` 문법을 사용합니다.
  rules:
    # avoid_print: false  # `avoid_print` rule을 끄려면 주석을 해제합니다.
    # prefer_single_quotes: true  # `prefer_single_quotes` rule을 켜려면 주석을 해제합니다.

# 이 파일에 대한 추가 정보:
# https://dart.dev/guides/language/analysis-options
