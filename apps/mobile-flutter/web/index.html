<!DOCTYPE html>
<html>
<head>
  <!--
    web app을 root가 아닌 path에서 제공한다면 아래 href 값을 실제 base path에 맞게 변경합니다.

    아래 path는 정상 동작을 위해 slash "/"로 시작하고 끝나야 합니다.

    자세한 내용:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    이 값은 base href placeholder이며, `flutter build`에 전달한 `--base-href` argument 값으로 교체됩니다.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ONMU 모바일 Flutter 앱.">

  <!-- iOS meta tag와 icon -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="onmu_mobile">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>onmu_mobile</title>
  <link rel="manifest" href="manifest.json">
  <link
    href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css"
    rel="stylesheet">
  <script>
    (function () {
      window.onmuPmtilesProtocolReady = false;
      window.onmuPmtilesProtocolStatus = 'pending';
      window.onmuPmtilesProtocolError = null;

      function errorMessage(error) {
        if (!error) {
          return 'unknown error';
        }
        return error.message || String(error);
      }

      window.onmuMaplibreLoadFailed = function (event) {
        window.onmuPmtilesProtocolReady = false;
        window.onmuPmtilesProtocolStatus = 'maplibre-load-failed';
        window.onmuPmtilesProtocolError = 'maplibre-gl script failed to load';
        console.error('[ONMU map] maplibre-gl script failed to load.', event);
      };

      window.onmuPmtilesLoadFailed = function (event) {
        window.onmuPmtilesProtocolReady = false;
        window.onmuPmtilesProtocolStatus = 'pmtiles-load-failed';
        window.onmuPmtilesProtocolError = 'pmtiles script failed to load';
        console.error('[ONMU map] pmtiles script failed to load.', event);
      };

      window.onmuRegisterPmtilesProtocol = function () {
        if (window.onmuPmtilesProtocolReady === true) {
          return true;
        }
        if (!window.maplibregl) {
          window.onmuPmtilesProtocolStatus = 'waiting-maplibre';
          console.info('[ONMU map] maplibregl global is not ready yet.');
          return false;
        }
        if (!window.pmtiles || !window.pmtiles.Protocol) {
          window.onmuPmtilesProtocolStatus = 'waiting-pmtiles';
          console.info('[ONMU map] pmtiles global is not ready yet.');
          return false;
        }

        try {
          const protocol = window.onmuPmtilesProtocol || new window.pmtiles.Protocol();
          window.maplibregl.addProtocol('pmtiles', protocol.tile);
          window.onmuPmtilesProtocol = protocol;
          window.onmuPmtilesProtocolReady = true;
          window.onmuPmtilesProtocolStatus = 'ready';
          window.onmuPmtilesProtocolError = null;
          console.info('[ONMU map] PMTiles protocol registered.');
          return true;
        } catch (error) {
          const message = errorMessage(error);
          if (window.onmuPmtilesProtocol && message.toLowerCase().includes('pmtiles')) {
            window.onmuPmtilesProtocolReady = true;
            window.onmuPmtilesProtocolStatus = 'ready-existing';
            window.onmuPmtilesProtocolError = null;
            console.warn('[ONMU map] PMTiles protocol was already registered.', error);
            return true;
          }
          window.onmuPmtilesProtocolReady = false;
          window.onmuPmtilesProtocolStatus = 'registration-failed';
          window.onmuPmtilesProtocolError = message;
          console.error('[ONMU map] PMTiles protocol registration failed.', error);
          return false;
        }
      };
    })();
  </script>
  <script
    src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"
    onload="window.onmuMaplibreLoaded = true; window.onmuRegisterPmtilesProtocol();"
    onerror="window.onmuMaplibreLoadFailed(event);"></script>
  <script
    src="https://unpkg.com/pmtiles@3.0.6/dist/pmtiles.js"
    onload="window.onmuPmtilesLoaded = true; window.onmuRegisterPmtilesProtocol();"
    onerror="window.onmuPmtilesLoadFailed(event);"></script>
  <script>
    window.onmuRegisterPmtilesProtocol();
  </script>
</head>
<body>
  <!--
    "flutter_bootstrap.js" script는 커스터마이즈할 수 있습니다.
    Flutter loader에 custom configuration을 제공하거나 초기화 중 사용자 feedback을 줄 때 유용합니다.

    자세한 내용:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
