name: onmu_mobile
description: "ONMU 모바일 Flutter 앱."
# 이 설정은 private package가 실수로 pub.dev에 publish되는 것을 막습니다.
publish_to: 'none' # pub.dev에 publish하려면 이 줄을 제거합니다.

# 앱 버전과 빌드 번호를 정의합니다.
# 버전 번호는 1.2.43처럼 점으로 구분된 세 숫자입니다.
# 필요한 경우 + 뒤에 build number를 붙일 수 있습니다.
# flutter build에서 --build-name과 --build-number로 각각 override할 수 있습니다.
# Android에서는 build-name이 versionName, build-number가 versionCode로 사용됩니다.
# Android versioning 참고: https://developer.android.com/studio/publish/versioning
# iOS에서는 build-name이 CFBundleShortVersionString, build-number가 CFBundleVersion으로 사용됩니다.
# iOS versioning 참고:
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# Windows에서는 build-name이 product/file version의 major, minor, patch로 사용되고 build-number가 build suffix로 사용됩니다.
version: 1.0.0+1

environment:
  sdk: ^3.12.0

# dependencies에는 앱 실행에 필요한 package를 선언합니다.
# dependency를 최신 major version까지 자동으로 올리려면 `flutter pub upgrade --major-versions`를 실행합니다.
# 또는 아래 version number를 pub.dev의 최신 version으로 직접 수정할 수 있습니다.
# 더 새로운 version이 있는지 보려면 `flutter pub outdated`를 실행합니다.
dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Cupertino Icons font를 앱에 추가합니다.
  # iOS style icon이 필요할 때 CupertinoIcons class와 함께 사용합니다.
  cupertino_icons: ^1.0.8
  go_router: ^18.0.1
  flutter_riverpod: ^3.4.2
  dio: ^5.11.0
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  flutter_secure_storage: ^11.0.0
  url_launcher: ^6.3.2
  app_links: ^7.2.1
  maplibre_gl: ^0.26.2
  image_picker: ^1.2.3
  permission_handler: ^13.0.0
  geolocator: ^14.0.3
  sentry_flutter: ^9.26.0

  # 라우팅: StatefulShellRoute 기반 하단 탭 구조

  # 상태 관리: 프로토타입 단계에서는 최소 사용, 비즈니스 로직 단계에서 확장

dev_dependencies:
  flutter_test:
    sdk: flutter

  # flutter_lints package는 권장 lint rule 묶음입니다.
  # package root의 `analysis_options.yaml`에서 활성화됩니다.
  # 특정 lint rule을 끄거나 추가하려면 해당 파일을 수정합니다.
  flutter_lints: ^6.0.0

# pubspec의 일반 Dart 설정은 다음 문서를 참고합니다.
# https://dart.dev/tools/pub/pubspec

# 아래 section은 Flutter package 전용입니다.
flutter:

  # Material Icons font를 앱에 포함해 Material Icons class를 사용할 수 있게 합니다.
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/splash/
    - assets/images/auth/
    - assets/images/auth/kakao_logo.png
    - assets/images/auth/google_logo.png
    - assets/images/auth/naver_logo.png
    - assets/images/character/female/body/
    - assets/images/character/female/eyes/
    - assets/images/character/female/hair/
    - assets/images/character/female/clothes/
    - assets/images/character/mouth.png
    - assets/images/character/male/body/
    - assets/images/character/male/eyes/
    - assets/images/character/male/hair/
    - assets/images/character/male/clothes/
    - assets/images/diary_decorate/
    - assets/images/diary_decorate/background/
    - assets/images/diary_decorate/clip/
    - assets/images/diary_decorate/masking_tape/
    - assets/images/diary_decorate/scratch_paper/
    - assets/images/diary_decorate/stamp/
    - assets/images/diary_decorate/sticker/
    - assets/fonts/mona/01_Main/
    - assets/fonts/mona/02_Emoji/
    - assets/fonts/mona/03_Text/

  # image asset은 해상도별 variant를 가리킬 수 있습니다. 참고:
  # https://flutter.dev/to/resolution-aware-images

  # package dependency에서 asset을 추가하는 방법은 다음을 참고합니다.
  # https://flutter.dev/to/asset-from-package

  fonts:
    - family: Mona10
      fonts:
        - asset: assets/fonts/mona/01_Main/Mona10.otf
        - asset: assets/fonts/mona/01_Main/Mona10-Bold.otf
          weight: 700
    - family: Mona10x12
      fonts:
        - asset: assets/fonts/mona/01_Main/Mona10x12.otf
        - asset: assets/fonts/mona/01_Main/Mona10x12-Bold.otf
          weight: 700
    - family: Mona12
      fonts:
        - asset: assets/fonts/mona/01_Main/Mona12.otf
        - asset: assets/fonts/mona/01_Main/Mona12-Bold.otf
          weight: 700
    - family: Mona8x12
      fonts:
        - asset: assets/fonts/mona/01_Main/Mona8x12.otf
    - family: Mona12Emoji
      fonts:
        - asset: assets/fonts/mona/02_Emoji/Mona12Emoji.otf
    - family: Mona12ColorEmoji
      fonts:
        - asset: assets/fonts/mona/02_Emoji/Mona12ColorEmoji.otf
    - family: Mona12TextHK
      fonts:
        - asset: assets/fonts/mona/03_Text/Mona12TextHK.otf
    - family: Mona12TextJP
      fonts:
        - asset: assets/fonts/mona/03_Text/Mona12TextJP.otf
    - family: Mona12TextKR
      fonts:
        - asset: assets/fonts/mona/03_Text/Mona12TextKR.otf
    - family: Mona12TextSC
      fonts:
        - asset: assets/fonts/mona/03_Text/Mona12TextSC.otf
    - family: Mona12TextTC
      fonts:
        - asset: assets/fonts/mona/03_Text/Mona12TextTC.otf
