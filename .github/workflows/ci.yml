name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install YAML parser
        run: python -m pip install pyyaml

      - name: Validate YAML files
        run: |
          python - <<'PY'
          import pathlib, yaml
          for path in pathlib.Path(".").rglob("*"):
              if path.suffix in {".yml", ".yaml"} and ".git" not in path.parts:
                  with path.open("r", encoding="utf-8") as f:
                      yaml.safe_load(f)
                  print(f"ok {path}")
          PY

      - name: Check Docker Compose config
        if: hashFiles('infra/compose/docker-compose.yml') != ''
        run: docker compose -f infra/compose/docker-compose.yml config

  flutter:
    name: Flutter app
    runs-on: ubuntu-latest
    if: hashFiles('apps/mobile-flutter/pubspec.yaml') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter pub get
        working-directory: apps/mobile-flutter
        run: flutter pub get
      - name: Flutter analyze
        working-directory: apps/mobile-flutter
        run: flutter analyze
      - name: Flutter test
        working-directory: apps/mobile-flutter
        run: flutter test

  brand-web:
    name: Brand web
    runs-on: ubuntu-latest
    if: hashFiles('apps/brand-web/package.json') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/brand-web/package-lock.json
      - name: Install dependencies
        working-directory: apps/brand-web
        run: npm ci
      - name: Build
        working-directory: apps/brand-web
        run: npm run build
