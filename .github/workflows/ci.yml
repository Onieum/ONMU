name: CI

on:
  pull_request:
    branches: [dev, main]
  # dev push 시 배포는 deploy-staging-vm.yml 이 담당하므로 CI 중복 실행을 줄이기 위해
  # push 트리거는 두지 않는다. PR이 merge 게이트다.

permissions:
  contents: read

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install YAML parser
        run: python -m pip install pyyaml

      - name: Validate YAML files
        run: |
          python - <<'PY'
          import pathlib, yaml
          for path in pathlib.Path(".").rglob("*"):
              if path.suffix in {".yml", ".yaml"} and ".git" not in path.parts:
                  with path.open("r", encoding="utf-8") as f:
                      yaml.safe_load(f)
                  print(f"ok {path}")
          PY

      - name: Check Docker Compose config
        if: hashFiles('infra/compose/docker-compose.yml') != ''
        run: docker compose -f infra/compose/docker-compose.yml config

  flutter:
    name: Flutter app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
      - name: Flutter pub get
        working-directory: apps/mobile-flutter
        run: flutter pub get
      # 개발 편의를 위해 analyze 까지만 게이트한다. flutter test 와 gradle wrapper 확인은
      # 로컬/릴리스 단계에서 실행한다. 잡 이름은 브랜치 보호 필수 체크("Flutter app") 유지.
      - name: Flutter analyze
        working-directory: apps/mobile-flutter
        run: flutter analyze
