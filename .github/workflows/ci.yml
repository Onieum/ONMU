name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install YAML parser
        run: python -m pip install pyyaml

      - name: Validate YAML files
        run: |
          python - <<'PY'
          import pathlib, yaml
          for path in pathlib.Path(".").rglob("*"):
              if path.suffix in {".yml", ".yaml"} and ".git" not in path.parts:
                  with path.open("r", encoding="utf-8") as f:
                      yaml.safe_load(f)
                  print(f"ok {path}")
          PY

      - name: Check Docker Compose config
        if: hashFiles('infra/compose/docker-compose.yml') != ''
        run: docker compose -f infra/compose/docker-compose.yml config

  flutter:
    name: Flutter app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.5.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
      - name: Flutter pub get
        working-directory: apps/mobile-flutter
        run: flutter pub get
      - name: Check Android Gradle wrapper
        working-directory: apps/mobile-flutter/android
        run: ./gradlew --version
      - name: Flutter analyze
        working-directory: apps/mobile-flutter
        run: flutter analyze
      - name: Flutter test
        working-directory: apps/mobile-flutter
        run: flutter test
