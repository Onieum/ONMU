name: Terraform Staging

on:
  pull_request:
    branches: [dev]
    paths:
      - ".github/workflows/terraform-staging.yml"
      - ".azure/**"
      - "docs/architecture/**"
      - "docs/operations/azure-*.md"
      - "infra/terraform/**"
  push:
    branches: [dev]
    paths:
      - ".github/workflows/terraform-staging.yml"
      - ".azure/**"
      - "docs/architecture/**"
      - "docs/operations/azure-*.md"
      - "infra/terraform/**"
  workflow_dispatch:
    inputs:
      backend_smoke:
        description: "Run Azure OIDC staging backend init smoke. No plan or apply is executed."
        required: true
        type: boolean
        default: false
      wave:
        description: "Optional staging infra wave. Wave jobs require azure-staging-apply approval."
        required: true
        type: choice
        default: none
        options:
          - none
          - acr_observability
          - core_foundation
          - core_diagnostics
          - frontdoor_tile_edge
          - frontdoor_diagnostics
          - db_and_app_ready
      apply_wave:
        description: "Apply the selected wave after protected environment approval. Leave false for plan only."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"

jobs:
  terraform-validate:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform -chdir=infra/terraform fmt -recursive -check

      - name: Terraform validate root modules
        shell: bash
        run: |
          set -euo pipefail
          for module in \
            infra/terraform/bootstrap/state-backend \
            infra/terraform/environments/staging \
            infra/terraform/environments/prod
          do
            terraform -chdir="$module" init -backend=false
            terraform -chdir="$module" validate
          done

  staging-backend-smoke:
    name: Staging backend init smoke
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.backend_smoke == true }}
    runs-on: ubuntu-latest
    environment: azure-staging-apply
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v3

      - name: Validate Azure workflow variables
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing Azure workflow variable::$name must be configured on the azure-staging-apply environment."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Required Azure workflow variable names are configured."

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Init staging remote backend
        working-directory: infra/terraform/environments/staging
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=3dt-final-team1" \
            -backend-config="storage_account_name=onmutfstatekrc001" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=onmu/staging/terraform.tfstate" \
            -backend-config="use_azuread_auth=true"
          echo "Staging backend init completed. terraform plan/apply/state list were not executed."

  staging-wave-plan:
    name: Staging wave plan summary
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.wave != 'none' }}
    runs-on: ubuntu-latest
    environment: azure-staging-apply
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v3

      - name: Validate Azure workflow variables
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing Azure workflow variable::$name must be configured on the azure-staging-apply environment."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Required Azure workflow variable names are configured."

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Write selected staging wave variables
        id: wave_vars
        shell: bash
        env:
          STAGING_POSTGRES_ADMINISTRATOR_PASSWORD: ${{ secrets.STAGING_POSTGRES_ADMINISTRATOR_PASSWORD }}
          STAGING_SPRING_API_IMAGE: ${{ vars.STAGING_SPRING_API_IMAGE || secrets.STAGING_SPRING_API_IMAGE }}
          STAGING_WORKER_IMAGE: ${{ vars.STAGING_WORKER_IMAGE || secrets.STAGING_WORKER_IMAGE }}
        run: |
          set -euo pipefail
          WAVE_FILE="$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}.tfvars"
          cat > "$WAVE_FILE" <<'EOF'
          location      = "koreacentral"
          region_code   = "krc"
          name_suffix   = "001"
          owner         = "onmu-team"
          cost_center   = "onmu-staging"

          create_resource_group        = false
          existing_resource_group_name = "3dt-final-team1"
          EOF

          case "${{ inputs.wave }}" in
            acr_observability)
              cat >> "$WAVE_FILE" <<'EOF'

          spring_api_image = "ghcr.io/onieum/onmu-api-spring:staging-placeholder"
          worker_enabled   = false

          enabled_modules = {
            observability              = true
            container_registry         = true
            key_vault                  = false
            postgres                   = false
            redis                      = false
            storage                    = false
            cdn                        = false
            front_door                 = false
            eventhubs                  = false
            container_apps_environment = false
            container_apps             = false
            diagnostics                = false
          }
          EOF
              ;;
            core_foundation)
              cat >> "$WAVE_FILE" <<'EOF'

          spring_api_image = "ghcr.io/onieum/onmu-api-spring:staging-placeholder"
          worker_enabled   = false

          enabled_modules = {
            observability              = true
            container_registry         = true
            key_vault                  = true
            postgres                   = false
            redis                      = true
            storage                    = true
            cdn                        = false
            front_door                 = false
            eventhubs                  = true
            container_apps_environment = true
            container_apps             = false
            diagnostics                = false
          }
          EOF
              ;;
            core_diagnostics)
              cat >> "$WAVE_FILE" <<'EOF'

          spring_api_image = "ghcr.io/onieum/onmu-api-spring:staging-placeholder"
          worker_enabled   = false

          enabled_modules = {
            observability              = true
            container_registry         = true
            key_vault                  = true
            postgres                   = false
            redis                      = true
            storage                    = true
            cdn                        = false
            front_door                 = false
            eventhubs                  = true
            container_apps_environment = true
            container_apps             = false
            diagnostics                = true
          }
          EOF
              ;;
            frontdoor_tile_edge)
              cat >> "$WAVE_FILE" <<'EOF'

          spring_api_image = "ghcr.io/onieum/onmu-api-spring:staging-placeholder"
          worker_enabled   = false

          enabled_modules = {
            observability              = true
            container_registry         = true
            key_vault                  = true
            postgres                   = false
            redis                      = true
            storage                    = true
            cdn                        = false
            front_door                 = true
            eventhubs                  = true
            container_apps_environment = true
            container_apps             = false
            diagnostics                = false
          }
          EOF
              ;;
            frontdoor_diagnostics)
              cat >> "$WAVE_FILE" <<'EOF'

          spring_api_image = "ghcr.io/onieum/onmu-api-spring:staging-placeholder"
          worker_enabled   = false

          enabled_modules = {
            observability              = true
            container_registry         = true
            key_vault                  = true
            postgres                   = false
            redis                      = true
            storage                    = true
            cdn                        = false
            front_door                 = true
            eventhubs                  = true
            container_apps_environment = true
            container_apps             = false
            diagnostics                = true
          }
          EOF
              ;;
            db_and_app_ready)
              if [ -z "${STAGING_POSTGRES_ADMINISTRATOR_PASSWORD:-}" ]; then
                echo "::error title=Missing protected PostgreSQL secret::STAGING_POSTGRES_ADMINISTRATOR_PASSWORD must be configured before db_and_app_ready plan/apply."
                exit 1
              fi
              if [ -z "${STAGING_SPRING_API_IMAGE:-}" ] || [ -z "${STAGING_WORKER_IMAGE:-}" ]; then
                echo "::error title=Missing staging image variable::STAGING_SPRING_API_IMAGE and STAGING_WORKER_IMAGE must be configured before db_and_app_ready plan/apply."
                exit 1
              fi
              {
                echo ""
                printf 'spring_api_image = "%s"\n' "$STAGING_SPRING_API_IMAGE"
                printf 'worker_image     = "%s"\n' "$STAGING_WORKER_IMAGE"
                echo "worker_enabled   = true"
              } >> "$WAVE_FILE"
              cat >> "$WAVE_FILE" <<'EOF'

          enabled_modules = {
            observability              = true
            container_registry         = true
            key_vault                  = true
            postgres                   = true
            redis                      = true
            storage                    = true
            cdn                        = false
            front_door                 = false
            eventhubs                  = true
            container_apps_environment = true
            container_apps             = true
            diagnostics                = false
          }
          EOF
              ;;
            *)
              echo "::error title=Unsupported staging wave::Unknown wave input."
              exit 1
              ;;
          esac

          echo "path=$WAVE_FILE" >> "$GITHUB_OUTPUT"
          echo "Selected staging wave variable file was generated in RUNNER_TEMP."

      - name: Init staging remote backend
        working-directory: infra/terraform/environments/staging
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=3dt-final-team1" \
            -backend-config="storage_account_name=onmutfstatekrc001" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=onmu/staging/terraform.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: Plan selected staging wave without raw plan output
        id: plan
        working-directory: infra/terraform/environments/staging
        shell: bash
        env:
          TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          TF_VAR_postgres_administrator_password: ${{ secrets.STAGING_POSTGRES_ADMINISTRATOR_PASSWORD }}
        run: |
          set +e
          terraform plan \
            -input=false \
            -no-color \
            -detailed-exitcode \
            -out "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}.tfplan" \
            -var-file="${{ steps.wave_vars.outputs.path }}" \
            > "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}-plan.log" 2>&1
          status=$?
          set -e
          if [ "$status" -eq 1 ]; then
            echo "::error title=Terraform plan failed::Review provider auth, RBAC, or module validation. Raw plan output was not printed."
            exit 1
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          terraform show -json "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}.tfplan" > "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}.tfplan.json"
          echo "Staging wave resource/action summary:"
          jq -r '
            [.resource_changes[]? | {type: .type, actions: (.change.actions | join(","))}]
            | group_by(.type + "|" + .actions)
            | map({type: .[0].type, actions: .[0].actions, count: length})
            | sort_by(.type, .actions)
            | .[]
            | "- " + .actions + " " + .type + ": " + (.count | tostring)
          ' "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}.tfplan.json"
          rm -f "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}-plan.log" "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}.tfplan.json"

      - name: Confirm no apply occurred
        run: |
          echo "Staging wave plan completed. terraform apply was not executed in this job."

  staging-wave-apply:
    name: Staging wave apply
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.wave != 'none' && inputs.apply_wave == true }}
    needs: staging-wave-plan
    runs-on: ubuntu-latest
    environment: azure-staging-apply
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v3

      - name: Validate Azure workflow variables
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing Azure workflow variable::$name must be configured on the azure-staging-apply environment."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Required Azure workflow variable names are configured."

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Write selected staging wave variables
        id: wave_vars
        shell: bash
        env:
          STAGING_POSTGRES_ADMINISTRATOR_PASSWORD: ${{ secrets.STAGING_POSTGRES_ADMINISTRATOR_PASSWORD }}
          STAGING_SPRING_API_IMAGE: ${{ vars.STAGING_SPRING_API_IMAGE || secrets.STAGING_SPRING_API_IMAGE }}
          STAGING_WORKER_IMAGE: ${{ vars.STAGING_WORKER_IMAGE || secrets.STAGING_WORKER_IMAGE }}
        run: |
          set -euo pipefail
          WAVE_FILE="$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}.tfvars"
          cat > "$WAVE_FILE" <<'EOF'
          location      = "koreacentral"
          region_code   = "krc"
          name_suffix   = "001"
          owner         = "onmu-team"
          cost_center   = "onmu-staging"

          create_resource_group        = false
          existing_resource_group_name = "3dt-final-team1"
          EOF

          case "${{ inputs.wave }}" in
            acr_observability)
              cat >> "$WAVE_FILE" <<'EOF'

          spring_api_image = "ghcr.io/onieum/onmu-api-spring:staging-placeholder"
          worker_enabled   = false

          enabled_modules = {
            observability              = true
            container_registry         = true
            key_vault                  = false
            postgres                   = false
            redis                      = false
            storage                    = false
            cdn                        = false
            front_door                 = false
            eventhubs                  = false
            container_apps_environment = false
            container_apps             = false
            diagnostics                = false
          }
          EOF
              ;;
            core_foundation)
              cat >> "$WAVE_FILE" <<'EOF'

          spring_api_image = "ghcr.io/onieum/onmu-api-spring:staging-placeholder"
          worker_enabled   = false

          enabled_modules = {
            observability              = true
            container_registry         = true
            key_vault                  = true
            postgres                   = false
            redis                      = true
            storage                    = true
            cdn                        = false
            front_door                 = false
            eventhubs                  = true
            container_apps_environment = true
            container_apps             = false
            diagnostics                = false
          }
          EOF
              ;;
            core_diagnostics)
              cat >> "$WAVE_FILE" <<'EOF'

          spring_api_image = "ghcr.io/onieum/onmu-api-spring:staging-placeholder"
          worker_enabled   = false

          enabled_modules = {
            observability              = true
            container_registry         = true
            key_vault                  = true
            postgres                   = false
            redis                      = true
            storage                    = true
            cdn                        = false
            front_door                 = false
            eventhubs                  = true
            container_apps_environment = true
            container_apps             = false
            diagnostics                = true
          }
          EOF
              ;;
            frontdoor_tile_edge)
              cat >> "$WAVE_FILE" <<'EOF'

          spring_api_image = "ghcr.io/onieum/onmu-api-spring:staging-placeholder"
          worker_enabled   = false

          enabled_modules = {
            observability              = true
            container_registry         = true
            key_vault                  = true
            postgres                   = false
            redis                      = true
            storage                    = true
            cdn                        = false
            front_door                 = true
            eventhubs                  = true
            container_apps_environment = true
            container_apps             = false
            diagnostics                = false
          }
          EOF
              ;;
            frontdoor_diagnostics)
              cat >> "$WAVE_FILE" <<'EOF'

          spring_api_image = "ghcr.io/onieum/onmu-api-spring:staging-placeholder"
          worker_enabled   = false

          enabled_modules = {
            observability              = true
            container_registry         = true
            key_vault                  = true
            postgres                   = false
            redis                      = true
            storage                    = true
            cdn                        = false
            front_door                 = true
            eventhubs                  = true
            container_apps_environment = true
            container_apps             = false
            diagnostics                = true
          }
          EOF
              ;;
            db_and_app_ready)
              if [ -z "${STAGING_POSTGRES_ADMINISTRATOR_PASSWORD:-}" ]; then
                echo "::error title=Missing protected PostgreSQL secret::STAGING_POSTGRES_ADMINISTRATOR_PASSWORD must be configured before db_and_app_ready plan/apply."
                exit 1
              fi
              if [ -z "${STAGING_SPRING_API_IMAGE:-}" ] || [ -z "${STAGING_WORKER_IMAGE:-}" ]; then
                echo "::error title=Missing staging image variable::STAGING_SPRING_API_IMAGE and STAGING_WORKER_IMAGE must be configured before db_and_app_ready plan/apply."
                exit 1
              fi
              {
                echo ""
                printf 'spring_api_image = "%s"\n' "$STAGING_SPRING_API_IMAGE"
                printf 'worker_image     = "%s"\n' "$STAGING_WORKER_IMAGE"
                echo "worker_enabled   = true"
              } >> "$WAVE_FILE"
              cat >> "$WAVE_FILE" <<'EOF'

          enabled_modules = {
            observability              = true
            container_registry         = true
            key_vault                  = true
            postgres                   = true
            redis                      = true
            storage                    = true
            cdn                        = false
            front_door                 = false
            eventhubs                  = true
            container_apps_environment = true
            container_apps             = true
            diagnostics                = false
          }
          EOF
              ;;
            *)
              echo "::error title=Unsupported staging wave::Unknown wave input."
              exit 1
              ;;
          esac

          echo "path=$WAVE_FILE" >> "$GITHUB_OUTPUT"
          echo "Selected staging wave variable file was generated in RUNNER_TEMP."

      - name: Init staging remote backend
        working-directory: infra/terraform/environments/staging
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=3dt-final-team1" \
            -backend-config="storage_account_name=onmutfstatekrc001" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=onmu/staging/terraform.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: Apply selected staging wave after protected approval
        working-directory: infra/terraform/environments/staging
        shell: bash
        env:
          TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          TF_VAR_postgres_administrator_password: ${{ secrets.STAGING_POSTGRES_ADMINISTRATOR_PASSWORD }}
        run: |
          set +e
          terraform plan \
            -input=false \
            -no-color \
            -out "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}.tfplan" \
            -var-file="${{ steps.wave_vars.outputs.path }}" \
            > "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}-plan.log" 2>&1
          plan_status=$?
          if [ "$plan_status" -ne 0 ]; then
            echo "::error title=Terraform plan failed before apply::Review provider auth, RBAC, or module validation. Raw plan output was not printed."
            exit 1
          fi
          terraform apply \
            -input=false \
            -auto-approve \
            "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}.tfplan" \
            > "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}-apply.log" 2>&1
          apply_status=$?
          set -e
          if [ "$apply_status" -ne 0 ]; then
            echo "::error title=Terraform apply failed::Review Azure RBAC, quota, or resource conflict. Raw apply output was not printed."
            exit 1
          fi
          terraform show -json "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}.tfplan" > "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}.tfplan.json"
          echo "Staging wave applied resource/action summary:"
          jq -r '
            [.resource_changes[]? | {type: .type, actions: (.change.actions | join(","))}]
            | group_by(.type + "|" + .actions)
            | map({type: .[0].type, actions: .[0].actions, count: length})
            | sort_by(.type, .actions)
            | .[]
            | "- " + .actions + " " + .type + ": " + (.count | tostring)
          ' "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}.tfplan.json"
          rm -f "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}-plan.log" "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}-apply.log" "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}.tfplan.json"
          echo "Staging wave apply completed. Review Azure resource/status/count smoke before starting the next wave."
