name: Terraform Staging

on:
  pull_request:
    branches: [dev]
    paths:
      - ".github/workflows/terraform-staging.yml"
      - ".azure/**"
      - "docs/architecture/**"
      - "docs/operations/azure-*.md"
      - "infra/terraform/**"
      - "scripts/ci/**"
  push:
    branches: [dev]
    paths:
      - ".github/workflows/terraform-staging.yml"
      - ".azure/**"
      - "docs/architecture/**"
      - "docs/operations/azure-*.md"
      - "infra/terraform/**"
      - "scripts/ci/**"
  workflow_dispatch:
    inputs:
      backend_smoke:
        description: "Run Azure OIDC staging backend init smoke. No plan or apply is executed."
        required: true
        type: boolean
        default: false
      wave:
        description: "Optional staging infra wave. Wave jobs require azure-staging-apply approval."
        required: true
        type: choice
        default: none
        options:
          - none
          - acr_observability
          - core_foundation
          - key_vault_rbac
          - core_diagnostics
          - managed_redis_ready
          - managed_redis_diagnostics
          - frontdoor_tile_edge
          - frontdoor_origin_access
          - frontdoor_diagnostics
          - postgres_ready
          - postgres_firewall_ready
          - api_app_ready
          - worker_app_ready
          - worker_ai_ready
          - ai_foundation
          - ai_diagnostics
          - db_and_app_ready
      apply_wave:
        description: "Apply the selected wave after protected environment approval. Leave false for plan only."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"

jobs:
  terraform-validate:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform -chdir=infra/terraform fmt -recursive -check

      - name: Terraform validate root modules
        run: |
          set -euo pipefail
          for module in \
            infra/terraform/bootstrap/state-backend \
            infra/terraform/environments/staging \
            infra/terraform/environments/prod
          do
            terraform -chdir="$module" init -backend=false -input=false
            terraform -chdir="$module" validate
          done

  staging-backend-smoke:
    name: Staging backend init smoke
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.backend_smoke == true }}
    runs-on: ubuntu-latest
    environment: azure-staging-apply
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3

      - name: Validate Azure workflow variables
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing Azure workflow variable::$name must be configured on the azure-staging-apply environment."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Required Azure workflow variable names are configured."

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Init staging remote backend
        working-directory: infra/terraform/environments/staging
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=3dt-final-team1" \
            -backend-config="storage_account_name=onmutfstatekrc001" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=onmu/staging/terraform.tfstate" \
            -backend-config="use_azuread_auth=true"
          echo "Staging backend init completed. terraform plan/apply/state list were not executed."

  staging-wave-plan:
    name: Staging wave plan summary
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.wave != 'none' }}
    runs-on: ubuntu-latest
    environment: azure-staging-apply
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3

      - name: Validate Azure workflow variables
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing Azure workflow variable::$name must be configured on the azure-staging-apply environment."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Required Azure workflow variable names are configured."

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Write selected staging wave variables
        id: wave_vars
        env:
          STAGING_POSTGRES_ADMINISTRATOR_PASSWORD: ${{ secrets.STAGING_POSTGRES_ADMINISTRATOR_PASSWORD }}
          STAGING_SPRING_API_IMAGE: ${{ vars.STAGING_SPRING_API_IMAGE || secrets.STAGING_SPRING_API_IMAGE }}
          STAGING_WORKER_IMAGE: ${{ vars.STAGING_WORKER_IMAGE || secrets.STAGING_WORKER_IMAGE }}
        run: |
          set -euo pipefail
          WAVE_FILE="$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}.tfvars"
          bash scripts/ci/write-staging-wave-vars.sh "${{ inputs.wave }}" "$WAVE_FILE"
          echo "path=$WAVE_FILE" >> "$GITHUB_OUTPUT"
          echo "Selected staging wave variable file was generated in RUNNER_TEMP."

      - name: Init staging remote backend
        working-directory: infra/terraform/environments/staging
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=3dt-final-team1" \
            -backend-config="storage_account_name=onmutfstatekrc001" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=onmu/staging/terraform.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: Verify AI foundation state before diagnostics
        if: ${{ inputs.wave == 'ai_diagnostics' }}
        working-directory: infra/terraform/environments/staging
        run: |
          set +e
          terraform state show 'module.ai_foundation[0].azurerm_machine_learning_workspace.this' >/dev/null 2>&1
          ml_status=$?
          terraform state show 'module.ai_foundation[0].azurerm_cognitive_account.vision_openai' >/dev/null 2>&1
          vision_status=$?
          set -e
          if [ "$ml_status" -ne 0 ] || [ "$vision_status" -ne 0 ]; then
            echo "::error title=AI diagnostics require applied foundation::Run ai_foundation with apply_wave=true first and confirm Staging wave apply succeeded before running ai_diagnostics."
            exit 1
          fi

      - name: Plan selected staging wave without raw plan output
        id: plan
        working-directory: infra/terraform/environments/staging
        env:
          TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          TF_VAR_postgres_administrator_password: ${{ secrets.STAGING_POSTGRES_ADMINISTRATOR_PASSWORD }}
        run: |
          target_args=()
          if [ "${{ inputs.wave }}" = "ai_foundation" ]; then
            target_args=(-target=module.ai_foundation)
            echo "Using targeted Terraform plan for ai_foundation to avoid unrelated staging resource changes."
          elif [ "${{ inputs.wave }}" = "ai_diagnostics" ]; then
            target_args=(-target=module.ai_diagnostic_settings)
            echo "Using targeted Terraform plan for ai_diagnostics to avoid unrelated staging resource changes."
          elif [ "${{ inputs.wave }}" = "worker_ai_ready" ]; then
            target_args=(-target=module.container_apps)
            echo "Using targeted Terraform plan for worker_ai_ready to avoid unrelated staging resource changes."
          fi
          set +e
          terraform plan \
            -input=false \
            -no-color \
            -detailed-exitcode \
            -out "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}.tfplan" \
            -var-file="${{ steps.wave_vars.outputs.path }}" \
            "${target_args[@]}" \
            > "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}-plan.log" 2>&1
          status=$?
          set -e
          if [ "$status" -eq 1 ]; then
            safe_hint=$(
              sed -E \
                -e 's/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/<redacted-guid>/g' \
                -e 's#/subscriptions/[^/[:space:]]+#/subscriptions/<redacted-subscription>#g' \
                "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}-plan.log" \
                | grep -E -m 1 'Error:|StatusCode=|Code=|Message=|authorization|permission|Forbidden|BadRequest|Conflict|Provider Registration|not registered|resource_provider_registrations|PublicAccessNotPermitted|retiring' || true
            )
            if [ -z "${safe_hint:-}" ]; then
              safe_hint="Review provider auth, RBAC, or module validation. Raw plan output was not printed."
            fi
            echo "::error title=Terraform plan failed::$safe_hint"
            exit 1
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          terraform show -json "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}.tfplan" > "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}.tfplan.json"
          echo "Staging wave resource/action summary:"
          jq -r '
            [.resource_changes[]? | {type: .type, actions: (.change.actions | join(","))}]
            | group_by(.type + "|" + .actions)
            | map({type: .[0].type, actions: .[0].actions, count: length})
            | sort_by(.type, .actions)
            | .[]
            | "- " + .actions + " " + .type + ": " + (.count | tostring)
          ' "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}.tfplan.json"
          bash "$GITHUB_WORKSPACE/scripts/ci/guard-staging-wave-summary.sh" "${{ inputs.wave }}" "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}.tfplan.json"
          rm -f \
            "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}-plan.log" \
            "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}.tfplan.json"

  staging-wave-apply:
    name: Staging wave apply
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.wave != 'none' && inputs.apply_wave == true }}
    needs: staging-wave-plan
    runs-on: ubuntu-latest
    environment: azure-staging-apply
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3

      - name: Validate Azure workflow variables
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing Azure workflow variable::$name must be configured on the azure-staging-apply environment."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Required Azure workflow variable names are configured."

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Write selected staging wave variables
        id: wave_vars
        env:
          STAGING_POSTGRES_ADMINISTRATOR_PASSWORD: ${{ secrets.STAGING_POSTGRES_ADMINISTRATOR_PASSWORD }}
          STAGING_SPRING_API_IMAGE: ${{ vars.STAGING_SPRING_API_IMAGE || secrets.STAGING_SPRING_API_IMAGE }}
          STAGING_WORKER_IMAGE: ${{ vars.STAGING_WORKER_IMAGE || secrets.STAGING_WORKER_IMAGE }}
        run: |
          set -euo pipefail
          WAVE_FILE="$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}.tfvars"
          bash scripts/ci/write-staging-wave-vars.sh "${{ inputs.wave }}" "$WAVE_FILE"
          echo "path=$WAVE_FILE" >> "$GITHUB_OUTPUT"
          echo "Selected staging wave variable file was generated in RUNNER_TEMP."

      - name: Init staging remote backend
        working-directory: infra/terraform/environments/staging
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=3dt-final-team1" \
            -backend-config="storage_account_name=onmutfstatekrc001" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=onmu/staging/terraform.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: Verify AI foundation state before diagnostics
        if: ${{ inputs.wave == 'ai_diagnostics' }}
        working-directory: infra/terraform/environments/staging
        run: |
          set +e
          terraform state show 'module.ai_foundation[0].azurerm_machine_learning_workspace.this' >/dev/null 2>&1
          ml_status=$?
          terraform state show 'module.ai_foundation[0].azurerm_cognitive_account.vision_openai' >/dev/null 2>&1
          vision_status=$?
          set -e
          if [ "$ml_status" -ne 0 ] || [ "$vision_status" -ne 0 ]; then
            echo "::error title=AI diagnostics require applied foundation::Run ai_foundation with apply_wave=true first and confirm Staging wave apply succeeded before running ai_diagnostics."
            exit 1
          fi

      - name: Apply selected staging wave after protected approval
        working-directory: infra/terraform/environments/staging
        env:
          TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          TF_VAR_postgres_administrator_password: ${{ secrets.STAGING_POSTGRES_ADMINISTRATOR_PASSWORD }}
        run: |
          target_args=()
          if [ "${{ inputs.wave }}" = "ai_foundation" ]; then
            target_args=(-target=module.ai_foundation)
            echo "Using targeted Terraform plan for ai_foundation to avoid unrelated staging resource changes."
          elif [ "${{ inputs.wave }}" = "ai_diagnostics" ]; then
            target_args=(-target=module.ai_diagnostic_settings)
            echo "Using targeted Terraform plan for ai_diagnostics to avoid unrelated staging resource changes."
          elif [ "${{ inputs.wave }}" = "worker_ai_ready" ]; then
            target_args=(-target=module.container_apps)
            echo "Using targeted Terraform plan for worker_ai_ready to avoid unrelated staging resource changes."
          fi
          set +e
          terraform plan \
            -input=false \
            -no-color \
            -out "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}.tfplan" \
            -var-file="${{ steps.wave_vars.outputs.path }}" \
            "${target_args[@]}" \
            > "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}-plan.log" 2>&1
          plan_status=$?
          set -e
          if [ "$plan_status" -ne 0 ]; then
            safe_hint=$(
              sed -E \
                -e 's/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/<redacted-guid>/g' \
                -e 's#/subscriptions/[^/[:space:]]+#/subscriptions/<redacted-subscription>#g' \
                "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}-plan.log" \
                | grep -E -m 1 'Error:|StatusCode=|Code=|Message=|authorization|permission|Forbidden|BadRequest|Conflict|Provider Registration|not registered|resource_provider_registrations|PublicAccessNotPermitted|retiring' || true
            )
            if [ -z "${safe_hint:-}" ]; then
              safe_hint="Review provider auth, RBAC, or module validation. Raw plan output was not printed."
            fi
            echo "::error title=Terraform plan failed before apply::$safe_hint"
            exit 1
          fi
          terraform show -json "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}.tfplan" > "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}.tfplan.json"
          bash "$GITHUB_WORKSPACE/scripts/ci/guard-staging-wave-summary.sh" "${{ inputs.wave }}" "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}.tfplan.json"
          set +e
          terraform apply \
            -input=false \
            -auto-approve \
            "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}.tfplan" \
            > "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}-apply.log" 2>&1
          apply_status=$?
          set -e
          if [ "$apply_status" -ne 0 ]; then
            safe_hint=$(
              sed -E \
                -e 's/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/<redacted-guid>/g' \
                -e 's#/subscriptions/[^/[:space:]]+#/subscriptions/<redacted-subscription>#g' \
                "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}-apply.log" \
                | grep -E -m 1 'Error:|StatusCode=|Code=|Message=|authorization|permission|Forbidden|BadRequest|Conflict|Provider Registration|not registered|resource_provider_registrations|PublicAccessNotPermitted|retiring' || true
            )
            if [ -z "${safe_hint:-}" ]; then
              safe_hint="Review Azure RBAC, quota, or resource conflict. Raw apply output was not printed."
            fi
            echo "::error title=Terraform apply failed::$safe_hint"
            exit 1
          fi
          terraform show -json "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}.tfplan" > "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}.tfplan.json"
          echo "Staging wave applied resource/action summary:"
          jq -r '
            [.resource_changes[]? | {type: .type, actions: (.change.actions | join(","))}]
            | group_by(.type + "|" + .actions)
            | map({type: .[0].type, actions: .[0].actions, count: length})
            | sort_by(.type, .actions)
            | .[]
            | "- " + .actions + " " + .type + ": " + (.count | tostring)
          ' "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}.tfplan.json"
          rm -f \
            "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}-plan.log" \
            "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}-apply.log" \
            "$RUNNER_TEMP/onmu-staging-${{ inputs.wave }}.tfplan.json"
          echo "Staging wave apply completed. Review Azure resource/status/count smoke before starting the next wave."
