name: Deploy Staging Spring API

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/deploy-staging-api.yml"
      - "services/api-spring/**"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional Spring API image tag override."
        required: false
        type: string

permissions:
  contents: read
  id-token: write
  actions: write

concurrency:
  group: aca-staging-spring-api
  cancel-in-progress: false

env:
  STAGING_RESOURCE_GROUP: ${{ vars.STAGING_RESOURCE_GROUP || '3dt-final-team1' }}
  STAGING_ACR_NAME: ${{ vars.STAGING_ACR_NAME || 'acronmustagingkrc001' }}
  STAGING_API_CONTAINER_APP_NAME: ${{ vars.STAGING_API_CONTAINER_APP_NAME || 'ca-onmu-staging-krc-001-api' }}
  STAGING_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL || 'https://staging-api.onmu.cloud' }}

jobs:
  deploy:
    name: Build, push, rollout, and smoke
    runs-on: ubuntu-latest
    environment: azure-staging-apply
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Validate Azure workflow variables
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing Azure workflow variable::$name must be configured on the azure-staging-apply environment."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Required Azure workflow variable names are configured."

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve staging image ref
        id: refs
        env:
          IMAGE_TAG_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || '' }}
        run: |
          set -euo pipefail
          image_tag="$IMAGE_TAG_INPUT"
          if [ -z "$image_tag" ]; then
            image_tag="staging-${GITHUB_SHA::7}"
          fi
          login_server="$(az acr show --name "$STAGING_ACR_NAME" --query loginServer -o tsv)"
          image_ref="$login_server/onmu-api-spring:$image_tag"
          revision_suffix="g${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "revision_suffix=$revision_suffix" >> "$GITHUB_OUTPUT"

      - name: Login to ACR
        run: |
          set -euo pipefail
          az acr login --name "$STAGING_ACR_NAME"

      - name: Build and push Spring API image
        run: |
          set -euo pipefail
          docker build \
            -t "${{ steps.refs.outputs.image_ref }}" \
            services/api-spring
          docker push "${{ steps.refs.outputs.image_ref }}"

      - name: Update Spring API Container App image
        run: |
          set -euo pipefail
          az containerapp update \
            --resource-group "$STAGING_RESOURCE_GROUP" \
            --name "$STAGING_API_CONTAINER_APP_NAME" \
            --image "${{ steps.refs.outputs.image_ref }}" \
            --revision-suffix "${{ steps.refs.outputs.revision_suffix }}" \
            --output none
          echo "Requested Spring API rollout for commit ${GITHUB_SHA::7}."

      - name: Wait for latest revision readiness
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            latest_revision="$(
              az containerapp show \
                --resource-group "$STAGING_RESOURCE_GROUP" \
                --name "$STAGING_API_CONTAINER_APP_NAME" \
                --query properties.latestRevisionName \
                -o tsv
            )"
            latest_ready_revision="$(
              az containerapp show \
                --resource-group "$STAGING_RESOURCE_GROUP" \
                --name "$STAGING_API_CONTAINER_APP_NAME" \
                --query properties.latestReadyRevisionName \
                -o tsv
            )"
            if [ -n "$latest_revision" ] && [ "$latest_revision" = "$latest_ready_revision" ]; then
              echo "Latest revision is ready: $latest_ready_revision"
              exit 0
            fi
            echo "Waiting for latest revision readiness. attempt=$attempt latest=$latest_revision ready=$latest_ready_revision"
            sleep 10
          done
          echo "::error title=Container App revision not ready::Latest Spring API revision did not become ready in time."
          exit 1

      - name: Smoke staging API
        run: |
          set -euo pipefail
          for path in /healthz /readyz; do
            for attempt in $(seq 1 18); do
              status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 "$STAGING_API_BASE_URL$path" || true)"
              if [ "$status" = "200" ]; then
                echo "$path returned 200."
                break
              fi
              if [ "$attempt" -eq 18 ]; then
                echo "::error title=Staging smoke failed::$path returned $status."
                exit 1
              fi
              echo "Waiting for $path to return 200. attempt=$attempt status=$status"
              sleep 5
            done
          done

          users_me_status="$(
            curl -sS -o /dev/null -w '%{http_code}' --max-time 5 \
              "$STAGING_API_BASE_URL/api/v1/users/me" || true
          )"
          if [ "$users_me_status" != "401" ]; then
            echo "::error title=Auth boundary smoke failed::No-token /api/v1/users/me returned $users_me_status instead of 401."
            exit 1
          fi
          echo "No-token /api/v1/users/me returned 401."

      - name: Report image ref for Terraform app wave
        run: |
          set -euo pipefail
          {
            echo "::notice title=Staging image ref::${{ steps.refs.outputs.image_ref }}"
            echo "::notice title=Terraform app wave sync::Before running a future Terraform app wave, set STAGING_SPRING_API_IMAGE to this image ref if it differs."
          }

      - name: Deployment summary
        run: |
          {
            echo "## Staging Spring API deploy"
            echo ""
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- image: \`${{ steps.refs.outputs.image_ref }}\`"
            echo "- app: \`${STAGING_API_CONTAINER_APP_NAME}\`"
            echo "- smoke: /healthz 200, /readyz 200, no-token /api/v1/users/me 401"
            echo "- Terraform app wave sync: update \`STAGING_SPRING_API_IMAGE\` manually if a later Terraform app wave would use an older image"
          } >> "$GITHUB_STEP_SUMMARY"
