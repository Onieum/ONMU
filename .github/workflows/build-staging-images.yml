name: Build Staging Images

# PR 트리거로 Spring API/worker 이미지의 로컬 빌드 검증만 수행.
# (구 ACR push(acr-push) 잡과 push_images 입력은 VM 하이브리드 호스팅 전환으로 제거됨.
#  운영 배포는 deploy-staging-vm.yml 이 VM 에서 직접 빌드한다.)

on:
  pull_request:
    branches: [dev]
    paths:
      - ".github/workflows/build-staging-images.yml"
      - "services/api-spring/**"
      - "services/workers/ai-data-worker/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    name: Docker build Spring API and worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Spring API image
        run: |
          set -euo pipefail
          docker build \
            -t onmu-api-spring:ci-${GITHUB_SHA::7} \
            services/api-spring

      - name: Build worker image
        run: |
          set -euo pipefail
          docker build \
            -t onmu-ai-data-worker:ci-${GITHUB_SHA::7} \
            services/workers/ai-data-worker

      - name: Build summary
        run: |
          echo "Built local-only validation images:"
          echo "- onmu-api-spring:ci-${GITHUB_SHA::7}"
          echo "- onmu-ai-data-worker:ci-${GITHUB_SHA::7}"
