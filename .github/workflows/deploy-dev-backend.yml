name: Deploy Windows backend

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      environment:
        description: Windows backend environment to deploy.
        required: true
        default: dev
        type: choice
        options:
          - dev
          - integration
      dry_run:
        description: Print deployment steps without stopping or starting backend processes.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}-backend
  cancel-in-progress: false

jobs:
  deploy-windows-dev-backend:
    name: Deploy Windows backend
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Windows, onmu-dev-backend]
    timeout-minutes: 20
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Deploy Spring backend
        shell: powershell
        env:
          ONMU_BACKEND_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
          ONMU_BACKEND_RUNTIME: spring
          ONMU_DEPLOY_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          $deployScript = if ($env:ONMU_BACKEND_ENVIRONMENT -eq "integration") {
            ".\scripts\windows\deploy-integration-backend.ps1"
          } else {
            ".\scripts\windows\deploy-dev-backend.ps1"
          }

          $deployArgs = @{
            Runtime = $env:ONMU_BACKEND_RUNTIME
          }
          if ($env:ONMU_DEPLOY_DRY_RUN -eq "true") {
            $deployArgs.DryRun = $true
          }

          & $deployScript @deployArgs
