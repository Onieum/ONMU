name: Jira Link Helper

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  remind-jira-link:
    name: Check Jira key in PR
    runs-on: ubuntu-latest
    steps:
      - name: Check title/body for Jira issue key
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if echo "$PR_TITLE $PR_BODY" | grep -Eq 'SCRUM-[0-9]+'; then
            echo "Jira 키가 확인되었습니다."
          else
            echo "::warning::Jira가 PR을 자동 연결할 수 있도록 PR 제목이나 본문에 SCRUM-12 같은 Jira 키를 추가하세요."
          fi
