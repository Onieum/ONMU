# GitHub 의존성 업데이트 자동화 설정입니다.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    labels:
      - ci
      - task

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:10"
      timezone: Asia/Seoul
    labels:
      - platform-infra
      - task

  - package-ecosystem: pub
    directory: /apps/mobile-flutter
    schedule:
      interval: weekly
      day: monday
      time: "09:20"
      timezone: Asia/Seoul
    labels:
      - flutter-mobile
      - task
