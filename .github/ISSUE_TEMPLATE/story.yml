name: "스토리"
description: 사용자 관점의 기능 요구사항
title: "story(scope): "
labels: ["story"]
body:
  - type: textarea
    id: user_story
    attributes:
      label: 사용자 스토리
      description: 사용자 관점으로 작성해주세요.
      placeholder: "약속 참여자로서, 그룹이 더 빠르게 결정할 수 있도록 장소 후보를 비교하고 싶다."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      placeholder: |
        - [ ] Given ...
        - [ ] When ...
        - [ ] Then ...
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: 도메인
      options:
        - mobile
        - profile
        - meetup-realtime
        - place-api
        - memory-character
        - brand-web
        - platform-infra
    validations:
      required: true
