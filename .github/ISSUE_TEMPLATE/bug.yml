name: "버그"
description: 버그 신고 및 수정 요청
title: "fix(scope): "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 일이 발생했나요?
      description: 어떤 문제가 발생했는지 설명해주세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 정상적으로 기대한 동작을 적어주세요.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: 환경
      placeholder: |
        - OS:
        - 앱 flavor:
        - 백엔드 환경:
    validations:
      required: false
